name: build_rocket

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: build_${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: intel_6th_gen_windows
            target: x86_64-windows-gnu
            cpu: skylake
            source_binary: rocket.exe
            output_binary: rocket_6th_gen_windows.exe

          - name: intel_10th_gen_windows
            target: x86_64-windows-gnu
            cpu: skylake+avx+crc32+cx8+sse+sse2+sse3+sse4_1+sse4_2+ssse3+xsave
            source_binary: rocket.exe
            output_binary: rocket_10th_gen_windows.exe

          - name: general_windows
            target: x86_64-windows-gnu
            cpu: x86_64
            source_binary: rocket.exe
            output_binary: rocket_general_windows.exe

          - name: general_linux
            target: x86_64-linux-musl
            cpu: x86_64
            source_binary: rocket
            output_binary: rocket_general_linux

    steps:
      - name: checkout_repository
        uses: actions/checkout@v6

      - name: install_zig
        shell: bash
        run: |
          zig_version="0.14.1"
          zig_archive="zig-x86_64-linux-${zig_version}.tar.xz"
          zig_url="https://ziglang.org/download/${zig_version}/${zig_archive}"
          zig_directory="${RUNNER_TEMP}/zig-${zig_version}"

          echo "[-] downloading Zig ${zig_version}"

          curl \
            --fail \
            --location \
            --retry 3 \
            --output "${RUNNER_TEMP}/${zig_archive}" \
            "${zig_url}"

          mkdir -p "${zig_directory}"

          tar \
            --extract \
            --file="${RUNNER_TEMP}/${zig_archive}" \
            --xz \
            --strip-components=1 \
            --directory="${zig_directory}"

          echo "${zig_directory}" >> "$GITHUB_PATH"

          echo "[+] installed Zig ${zig_version}"

      - name: verify_zig_version
        shell: bash
        run: |
          installed_version="$(zig version)"

          if [[ "${installed_version}" != "0.14.1" ]]; then
            echo "[!] expected Zig 0.14.1, got ${installed_version}"
            exit 1
          fi

          echo "[+] Zig ${installed_version}"

      - name: build_engine
        shell: bash
        run: |
          zig build \
            -Dtarget="${{ matrix.target }}" \
            -Dcpu="${{ matrix.cpu }}" \
            -Doptimize=ReleaseFast \
            -Dstrip=true

      - name: prepare_release_file
        shell: bash
        run: |
          mkdir -p release_files

          cp \
            "zig-out/bin/${{ matrix.source_binary }}" \
            "release_files/${{ matrix.output_binary }}"

          if [[ "${{ matrix.target }}" == *linux* ]]; then
            chmod +x "release_files/${{ matrix.output_binary }}"
          fi

      - name: upload_temporary_build
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: release_files/${{ matrix.output_binary }}
          if-no-files-found: error
          compression-level: 0

  create_release:
    name: create_release
    needs:
      - build
    runs-on: ubuntu-latest

    steps:
      - name: download_builds
        uses: actions/download-artifact@v8
        with:
          path: release_files
          merge-multiple: true

      - name: generate_release_metadata
        id: release_metadata
        shell: bash
        run: |
          unix_time="$(date +%s)"
          release_name="build-${GITHUB_SHA}-${unix_time}"

          echo "unix_time=${unix_time}" >> "$GITHUB_OUTPUT"
          echo "release_name=${release_name}" >> "$GITHUB_OUTPUT"

          echo "[+] release name: ${release_name}"

      - name: generate_checksums
        shell: bash
        run: |
          cd release_files
          sha256sum * > checksums_sha256.txt
          cat checksums_sha256.txt

      - name: create_github_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_metadata.outputs.release_name }}
          name: ${{ steps.release_metadata.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          body: |
            automated ReleaseFast build

            commit: `${{ github.sha }}`
            unix time: `${{ steps.release_metadata.outputs.unix_time }}`

            included builds:
            - `rocket_6th_gen_windows.exe`
            - `rocket_10th_gen_windows.exe`
            - `rocket_general_windows.exe`
            - `rocket_general_linux`
          files: |
            release_files/rocket_6th_gen_windows.exe
            release_files/rocket_10th_gen_windows.exe
            release_files/rocket_general_windows.exe
            release_files/rocket_general_linux
            release_files/checksums_sha256.txt
          fail_on_unmatched_files: true
          make_latest: true

      - name: delete_temporary_artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact_ids="$(
            gh api \
              --paginate \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
              --jq '.artifacts[].id'
          )"

          if [[ -z "${artifact_ids}" ]]; then
            echo "[-] no temporary artifacts found"
            exit 0
          fi

          while IFS= read -r artifact_id; do
            if [[ -z "${artifact_id}" ]]; then
              continue
            fi

            echo "[-] deleting artifact ${artifact_id}"

            gh api \
              --method DELETE \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"

            echo "[+] deleted artifact ${artifact_id}"
          done <<< "${artifact_ids}"
