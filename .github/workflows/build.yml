name: Build Rocket

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows - ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: i7-10700F
            cpu: cometlake
            output: rocket-i7-10700F.exe

          - name: Intel-6th-Gen
            cpu: skylake
            output: rocket-intel-6th-gen.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.1

      - name: Show Zig version
        run: zig version

      - name: Build
        run: >
          zig build
          -Dtarget=x86_64-windows-gnu
          -Dcpu=${{ matrix.cpu }}
          -Doptimize=ReleaseFast
          -Dstrip=true

      - name: Prepare artifact
        run: |
          mkdir -p artifacts
          cp zig-out/bin/rocket.exe "artifacts/${{ matrix.output }}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: artifacts/${{ matrix.output }}
          if-no-files-found: error
          compression-level: 9
